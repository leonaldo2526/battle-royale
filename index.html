<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle Royale</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a1a; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: Arial; color: white; overflow: hidden; }

    #pantalla-inicio { text-align: center; }
    #pantalla-inicio h1 { font-size: 48px; color: #ff4444; text-shadow: 0 0 20px rgba(255,68,68,0.8); margin-bottom: 10px; }
    #pantalla-inicio p { color: #aaaaaa; font-size: 16px; margin-bottom: 30px; }
    .input-nombre { padding: 12px 20px; border: 2px solid #ff4444; border-radius: 25px; background: #2d2d2d; color: white; font-size: 16px; width: 250px; text-align: center; margin-bottom: 20px; outline: none; }
    .btn-jugar { background: #ff4444; color: white; padding: 15px 50px; border: none; border-radius: 25px; font-size: 20px; cursor: pointer; font-weight: bold; transition: transform 0.1s; }
    .btn-jugar:hover { transform: scale(1.05); background: #cc3333; }

    #pantalla-juego { display: none; position: relative; }
    #canvas { border: 2px solid #333; display: block; }

    /* HUD */
    #hud { position: absolute; top: 0; left: 0; width: 100%; padding: 10px; pointer-events: none; }
    #vida-container { position: absolute; bottom: 80px; left: 10px; }
    #vida-barra-fondo { width: 150px; height: 15px; background: #333; border-radius: 10px; }
    #vida-barra { width: 100%; height: 15px; background: #ff4444; border-radius: 10px; transition: width 0.3s; }
    #vida-texto { font-size: 12px; color: white; margin-top: 3px; }
    #jugadores-vivos { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); padding: 8px 15px; border-radius: 10px; font-size: 14px; }
    #arma-actual { position: absolute; bottom: 80px; right: 10px; background: rgba(0,0,0,0.7); padding: 8px 15px; border-radius: 10px; font-size: 14px; }
    #kills { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 8px 15px; border-radius: 10px; font-size: 14px; }
    #zona-texto { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); background: rgba(255,68,68,0.8); padding: 5px 15px; border-radius: 10px; font-size: 13px; display: none; }

    /* JOYSTICK */
    #joystick-container { position: absolute; bottom: 20px; left: 20px; width: 100px; height: 100px; }
    #joystick-base { width: 100px; height: 100px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; position: relative; }
    #joystick-stick { width: 45px; height: 45px; background: rgba(255,255,255,0.4); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }

    /* BOTONES ACCIÓN */
    #botones-accion { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; }
    .btn-accion { width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 20px; cursor: pointer; font-weight: bold; }
    #btn-disparar { background: rgba(255,68,68,0.8); color: white; }
    #btn-cambiar { background: rgba(68,68,255,0.8); color: white; font-size: 14px; }

    /* PANTALLA MUERTE/VICTORIA */
    #pantalla-resultado { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    #resultado-titulo { font-size: 48px; font-weight: bold; margin-bottom: 20px; }
    #resultado-stats { font-size: 18px; color: #aaaaaa; margin-bottom: 30px; line-height: 2; }
    #btn-reiniciar { background: #ff4444; color: white; padding: 15px 40px; border: none; border-radius: 25px; font-size: 18px; cursor: pointer; font-weight: bold; }

    /* MINIMAPA */
    #minimapa { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); border: 1px solid #444; border-radius: 5px; }
  </style>
</head>
<body>

<!-- PANTALLA INICIO -->
<div id="pantalla-inicio">
  <h1>💀 BATTLE ROYALE</h1>
  <p>El último en pie gana</p>
  <br>
  <input type="text" class="input-nombre" id="nombre-jugador" placeholder="Tu nombre" maxlength="15">
  <br>
  <button class="btn-jugar" onclick="iniciarJuego()">⚔️ JUGAR</button>
  <br><br>
  <p style="font-size:13px;color:#666;">WASD o joystick para mover<br>Click o botón rojo para disparar</p>
</div>

<!-- PANTALLA JUEGO -->
<div id="pantalla-juego">
  <canvas id="canvas"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div id="kills">💀 Kills: <span id="kills-num">0</span></div>
    <div id="jugadores-vivos">👥 Vivos: <span id="vivos-num">20</span></div>
    <div id="arma-actual">🔫 <span id="arma-nombre">Pistola</span></div>
    <div id="vida-container">
      <div id="vida-barra-fondo"><div id="vida-barra"></div></div>
      <div id="vida-texto">❤️ <span id="vida-num">100</span>/100</div>
    </div>
    <div id="zona-texto">⚠️ ¡Estás fuera de la zona!</div>
  </div>

  <!-- MINIMAPA -->
  <canvas id="minimapa" width="100" height="100"></canvas>

  <!-- JOYSTICK -->
  <div id="joystick-container">
    <div id="joystick-base">
      <div id="joystick-stick"></div>
    </div>
  </div>

  <!-- BOTONES ACCIÓN -->
  <div id="botones-accion">
    <button class="btn-accion" id="btn-disparar" onclick="disparar()">🔫</button>
    <button class="btn-accion" id="btn-cambiar" onclick="cambiarArma()">🔄</button>
  </div>

  <!-- RESULTADO -->
  <div id="pantalla-resultado">
    <div id="resultado-titulo"></div>
    <div id="resultado-stats"></div>
    <button id="btn-reiniciar" onclick="reiniciarJuego()">🔄 Jugar de nuevo</button>
  </div>
</div>

<script>
// ============ CONFIGURACIÓN ============
const MAPA_W = 2000;
const MAPA_H = 2000;
const TILE = 40;
let canvas, ctx, minimapCanvas, minimapCtx;
let jugador, bots = [], balas = [], items = [];
let camX = 0, camY = 0;
let kills = 0;
let zonaRadio = 900;
let zonaCentroX = MAPA_W / 2;
let zonaCentroY = MAPA_H / 2;
let zonaTimer = 0;
let gameLoop;
let teclas = {};
let joystickActivo = false;
let joystickDX = 0, joystickDY = 0;
let nombreJugador = "Jugador";

const ARMAS = [
  { nombre: "Pistola", damage: 15, velocidad: 8, cadencia: 20, color: "#ffff00", balas: 12 },
  { nombre: "Rifle", damage: 35, velocidad: 12, cadencia: 40, color: "#00ffff", balas: 8 },
  { nombre: "Escopeta", damage: 60, velocidad: 7, cadencia: 60, color: "#ff8800", balas: 6 },
  { nombre: "Metralleta", damage: 10, velocidad: 10, cadencia: 8, color: "#ff00ff", balas: 30 }
];

// ============ MAPA ============
let mapa = [];
function generarMapa() {
  mapa = [];
  for (let y = 0; y < MAPA_H / TILE; y++) {
    mapa[y] = [];
    for (let x = 0; x < MAPA_W / TILE; x++) {
      const r = Math.random();
      if (r < 0.05) mapa[y][x] = 2; // árbol
      else if (r < 0.08) mapa[y][x] = 3; // roca
      else if (r < 0.12) mapa[y][x] = 4; // agua
      else mapa[y][x] = 1; // pasto
    }
  }
}

// ============ CLASES ============
class Entidad {
  constructor(x, y, color, nombre) {
    this.x = x; this.y = y;
    this.w = 20; this.h = 20;
    this.vida = 100; this.vidaMax = 100;
    this.velocidad = 3;
    this.color = color;
    this.nombre = nombre;
    this.armaIndex = 0;
    this.armas = [{ ...ARMAS[0] }];
    this.cadenciaTimer = 0;
    this.angulo = 0;
    this.vivo = true;
  }

  dibujar() {
    if (!this.vivo) return;
    const sx = this.x - camX;
    const sy = this.y - camY;
    if (sx < -30 || sx > canvas.width + 30 || sy < -30 || sy > canvas.height + 30) return;

    // Sombra
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath();
    ctx.ellipse(sx + 10, sy + 22, 12, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Cuerpo
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(sx + 10, sy + 10, 12, 0, Math.PI * 2);
    ctx.fill();

    // Borde
    ctx.strokeStyle = "rgba(255,255,255,0.4)";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Arma
    ctx.save();
    ctx.translate(sx + 10, sy + 10);
    ctx.rotate(this.angulo);
    ctx.fillStyle = "#888";
    ctx.fillRect(8, -3, 15, 6);
    ctx.restore();

    // Nombre
    ctx.fillStyle = "white";
    ctx.font = "11px Arial";
    ctx.textAlign = "center";
    ctx.fillText(this.nombre, sx + 10, sy - 5);

    // Vida
    const vidaPct = this.vida / this.vidaMax;
    ctx.fillStyle = "#333";
    ctx.fillRect(sx - 2, sy + 24, 24, 4);
    ctx.fillStyle = vidaPct > 0.5 ? "#44ff44" : vidaPct > 0.25 ? "#ffaa00" : "#ff4444";
    ctx.fillRect(sx - 2, sy + 24, 24 * vidaPct, 4);
  }

  recibirDano(cantidad) {
    this.vida -= cantidad;
    if (this.vida <= 0) {
      this.vida = 0;
      this.vivo = false;
    }
  }
}

class Bala {
  constructor(x, y, dx, dy, damage, color, dueno) {
    this.x = x; this.y = y;
    this.dx = dx; this.dy = dy;
    this.damage = damage;
    this.color = color;
    this.dueno = dueno;
    this.viva = true;
    this.radio = 4;
  }

  actualizar() {
    this.x += this.dx;
    this.y += this.dy;
    if (this.x < 0 || this.x > MAPA_W || this.y < 0 || this.y > MAPA_H) {
      this.viva = false;
    }
    // Colisión con obstáculos
    const tx = Math.floor(this.x / TILE);
    const ty = Math.floor(this.y / TILE);
    if (mapa[ty] && (mapa[ty][tx] === 2 || mapa[ty][tx] === 3 || mapa[ty][tx] === 4)) {
      this.viva = false;
    }
  }

  dibujar() {
    const sx = this.x - camX;
    const sy = this.y - camY;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(sx, sy, this.radio, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(sx - 1, sy - 1, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }
}

class Item {
  constructor(x, y, tipo) {
    this.x = x; this.y = y;
    this.tipo = tipo; // "botiquin", "arma", "escudo"
    this.activo = true;
    this.animTimer = 0;
  }

  dibujar() {
    if (!this.activo) return;
    const sx = this.x - camX;
    const sy = this.y - camY;
    if (sx < -20 || sx > canvas.width + 20 || sy < -20 || sy > canvas.height + 20) return;
    this.animTimer += 0.05;
    const flotacion = Math.sin(this.animTimer) * 3;
    ctx.save();
    ctx.translate(sx, sy + flotacion);
    if (this.tipo === "botiquin") {
      ctx.fillStyle = "#ff4444";
      ctx.fillRect(-10, -10, 20, 20);
      ctx.fillStyle = "white";
      ctx.fillRect(-3, -8, 6, 16);
      ctx.fillRect(-8, -3, 16, 6);
    } else if (this.tipo === "arma") {
      ctx.fillStyle = "#ffcc00";
      ctx.beginPath();
      ctx.arc(0, 0, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#1a1a1a";
      ctx.font = "bold 12px Arial";
      ctx.textAlign = "center";
      ctx.fillText("🔫", 0, 4);
    } else if (this.tipo === "escudo") {
      ctx.fillStyle = "#4444ff";
      ctx.beginPath();
      ctx.arc(0, 0, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "white";
      ctx.font = "12px Arial";
      ctx.textAlign = "center";
      ctx.fillText("🛡️", 0, 4);
    }
    ctx.restore();
  }
}

// ============ INICIAR JUEGO ============
function iniciarJuego() {
  nombreJugador = document.getElementById("nombre-jugador").value || "Jugador";
  document.getElementById("pantalla-inicio").style.display = "none";
  document.getElementById("pantalla-juego").style.display = "block";

  canvas = document.getElementById("canvas");
  ctx = canvas.getContext("2d");
  minimapCanvas = document.getElementById("minimapa");
  minimapCtx = minimapCanvas.getContext("2d");

  canvas.width = Math.min(window.innerWidth, 800);
  canvas.height = Math.min(window.innerHeight - 10, 600);

  generarMapa();
  crearJugador();
  crearBots();
  generarItems();
  configurarControles();
  configurarJoystick();

  kills = 0;
  zonaRadio = 900;
  zonaTimer = 0;

  if (gameLoop) cancelAnimationFrame(gameLoop);
  actualizar();
}

function crearJugador() {
  jugador = new Entidad(MAPA_W / 2, MAPA_H / 2, "#4488ff", nombreJugador);
  jugador.armas = [{ ...ARMAS[0] }, { ...ARMAS[Math.floor(Math.random() * 3) + 1] }];
}

function crearBots() {
  bots = [];
  const nombres = ["Carlos", "Maria", "Pedro", "Ana", "Luis", "Sofia", "Diego", "Laura", "Juan", "Elena", "Miguel", "Paula", "Roberto", "Carmen", "Andres", "Isabel", "Felipe", "Rosa", "Sergio"];
  for (let i = 0; i < 19; i++) {
    let x, y;
    do {
      x = Math.random() * (MAPA_W - 100) + 50;
      y = Math.random() * (MAPA_H - 100) + 50;
    } while (Math.abs(x - jugador.x) < 200 && Math.abs(y - jugador.y) < 200);
    const bot = new Entidad(x, y, `hsl(${Math.random() * 360}, 70%, 60%)`, nombres[i]);
    bot.armas = [{ ...ARMAS[Math.floor(Math.random() * ARMAS.length)] }];
    bot.velocidad = 1.5 + Math.random() * 1.5;
    bot.objetivo = null;
    bot.timerMovimiento = 0;
    bot.dirX = (Math.random() - 0.5) * 2;
    bot.dirY = (Math.random() - 0.5) * 2;
    bots.push(bot);
  }
}

function generarItems() {
  items = [];
  for (let i = 0; i < 50; i++) {
    const tipos = ["botiquin", "botiquin", "arma", "escudo"];
    items.push(new Item(
      Math.random() * (MAPA_W - 100) + 50,
      Math.random() * (MAPA_H - 100) + 50,
      tipos[Math.floor(Math.random() * tipos.length)]
    ));
  }
}

// ============ CONTROLES ============
function configurarControles() {
  document.addEventListener("keydown", e => teclas[e.key.toLowerCase()] = true);
  document.addEventListener("keyup", e => teclas[e.key.toLowerCase()] = false);
  canvas.addEventListener("click", e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left + camX;
    const my = e.clientY - rect.top + camY;
    dispararHacia(mx, my);
  });
  canvas.addEventListener("mousemove", e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left + camX;
    const my = e.clientY - rect.top + camY;
    jugador.angulo = Math.atan2(my - jugador.y - 10, mx - jugador.x - 10);
  });
}

function configurarJoystick() {
  const base = document.getElementById("joystick-base");
  const stick = document.getElementById("joystick-stick");
  const radio = 40;

  function moverStick(cx, cy, rect) {
    let dx = cx - rect.left - 50;
    let dy = cy - rect.top - 50;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > radio) { dx = dx / dist * radio; dy = dy / dist * radio; }
    stick.style.left = (50 + dx - 22.5) + "px";
    stick.style.top = (50 + dy - 22.5) + "px";
    joystickDX = dx / radio;
    joystickDY = dy / radio;
    joystickActivo = true;
  }

  base.addEventListener("touchstart", e => {
    e.preventDefault();
    const t = e.touches[0];
    moverStick(t.clientX, t.clientY, base.getBoundingClientRect());
  });
  base.addEventListener("touchmove", e => {
    e.preventDefault();
    const t = e.touches[0];
    moverStick(t.clientX, t.clientY, base.getBoundingClientRect());
  });
  base.addEventListener("touchend", () => {
    stick.style.left = "27.5px";
    stick.style.top = "27.5px";
    joystickDX = 0; joystickDY = 0;
    joystickActivo = false;
  });
}

// ============ DISPARAR ============
function disparar() {
  const angulo = jugador.angulo;
  dispararHacia(jugador.x + Math.cos(angulo) * 100, jugador.y + Math.sin(angulo) * 100);
}

function dispararHacia(tx, ty) {
  if (!jugador.vivo) return;
  const arma = jugador.armas[jugador.armaIndex];
  if (jugador.cadenciaTimer > 0) return;
  const dx = tx - jugador.x - 10;
  const dy = ty - jugador.y - 10;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const vel = arma.velocidad;

  if (arma.nombre === "Escopeta") {
    for (let i = -2; i <= 2; i++) {
      const spread = i * 0.1;
      balas.push(new Bala(
        jugador.x + 10, jugador.y + 10,
        (dx / dist + spread) * vel, (dy / dist + spread) * vel,
        arma.damage / 3, arma.color, "jugador"
      ));
    }
  } else {
    balas.push(new Bala(
      jugador.x + 10, jugador.y + 10,
      dx / dist * vel, dy / dist * vel,
      arma.damage, arma.color, "jugador"
    ));
  }
  jugador.cadenciaTimer = arma.cadencia;
}

function cambiarArma() {
  if (jugador.armas.length > 1) {
    jugador.armaIndex = (jugador.armaIndex + 1) % jugador.armas.length;
    document.getElementById("arma-nombre").textContent = jugador.armas[jugador.armaIndex].nombre;
  }
}

// ============ IA BOTS ============
function actualizarBot(bot) {
  if (!bot.vivo) return;
  bot.cadenciaTimer = Math.max(0, bot.cadenciaTimer - 1);
  bot.timerMovimiento--;

  // Buscar jugador o bot cercano
  let objetivo = null;
  let distMin = 400;

  if (jugador.vivo) {
    const d = Math.hypot(jugador.x - bot.x, jugador.y - bot.y);
    if (d < distMin) { distMin = d; objetivo = jugador; }
  }

  bots.forEach(b => {
    if (b !== bot && b.vivo) {
      const d = Math.hypot(b.x - bot.x, b.y - bot.y);
      if (d < distMin) { distMin = d; objetivo = b; }
    }
  });

  if (objetivo) {
    const dx = objetivo.x - bot.x;
    const dy = objetivo.y - bot.y;
    const dist = Math.hypot(dx, dy);
    bot.angulo = Math.atan2(dy, dx);

    if (dist > 150) {
      bot.x += (dx / dist) * bot.velocidad;
      bot.y += (dy / dist) * bot.velocidad;
    }

    if (dist < 300 && bot.cadenciaTimer <= 0) {
      const arma = bot.armas[0];
      balas.push(new Bala(
        bot.x + 10, bot.y + 10,
        (dx / dist + (Math.random() - 0.5) * 0.15) * arma.velocidad,
        (dy / dist + (Math.random() - 0.5) * 0.15) * arma.velocidad,
        arma.damage, arma.color, bot
      ));
      bot.cadenciaTimer = arma.cadencia + Math.random() * 30;
    }
  } else {
    if (bot.timerMovimiento <= 0) {
      bot.dirX = (Math.random() - 0.5) * 2;
      bot.dirY = (Math.random() - 0.5) * 2;
      bot.timerMovimiento = 60 + Math.random() * 120;
    }
    bot.x += bot.dirX * bot.velocidad;
    bot.y += bot.dirY * bot.velocidad;
  }

  // Mantenerse en zona
  const dZona = Math.hypot(bot.x - zonaCentroX, bot.y - zonaCentroY);
  if (dZona > zonaRadio - 50) {
    bot.x += (zonaCentroX - bot.x) / dZona * bot.velocidad * 2;
    bot.y += (zonaCentroY - bot.y) / dZona * bot.velocidad * 2;
  }

  bot.x = Math.max(10, Math.min(MAPA_W - 30, bot.x));
  bot.y = Math.max(10, Math.min(MAPA_H - 30, bot.y));

  // Recoger items
  items.forEach(item => {
    if (!item.activo) return;
    const d = Math.hypot(item.x - bot.x, item.y - bot.y);
    if (d < 25) {
      if (item.tipo === "botiquin") bot.vida = Math.min(bot.vidaMax, bot.vida + 40);
      item.activo = false;
    }
  });
}

// ============ ACTUALIZAR JUGADOR ============
function actualizarJugador() {
  if (!jugador.vivo) return;
  jugador.cadenciaTimer = Math.max(0, jugador.cadenciaTimer - 1);

  let dx = 0, dy = 0;
  if (teclas["w"] || teclas["arrowup"]) dy -= 1;
  if (teclas["s"] || teclas["arrowdown"]) dy += 1;
  if (teclas["a"] || teclas["arrowleft"]) dx -= 1;
  if (teclas["d"] || teclas["arrowright"]) dx += 1;
  if (joystickActivo) { dx = joystickDX; dy = joystickDY; }

  if (dx !== 0 || dy !== 0) {
    const dist = Math.sqrt(dx * dx + dy * dy);
    jugador.x += dx / dist * jugador.velocidad;
    jugador.y += dy / dist * jugador.velocidad;
    if (joystickActivo) jugador.angulo = Math.atan2(dy, dx);
  }

  if (teclas[" "]) disparar();

  jugador.x = Math.max(10, Math.min(MAPA_W - 30, jugador.x));
  jugador.y = Math.max(10, Math.min(MAPA_H - 30, jugador.y));

  // Recoger items
  items.forEach(item => {
    if (!item.activo) return;
    const d = Math.hypot(item.x - jugador.x, item.y - jugador.y);
    if (d < 25) {
      if (item.tipo === "botiquin") {
        jugador.vida = Math.min(jugador.vidaMax, jugador.vida + 40);
      } else if (item.tipo === "arma") {
        const nuevaArma = { ...ARMAS[Math.floor(Math.random() * ARMAS.length)] };
        if (jugador.armas.length < 3) jugador.armas.push(nuevaArma);
        else jugador.armas[jugador.armaIndex] = nuevaArma;
        document.getElementById("arma-nombre").textContent = jugador.armas[jugador.armaIndex].nombre;
      } else if (item.tipo === "escudo") {
        jugador.vidaMax = Math.min(150, jugador.vidaMax + 25);
        jugador.vida = Math.min(jugador.vidaMax, jugador.vida + 25);
      }
      item.activo = false;
    }
  });

  // Daño de zona
  const dZona = Math.hypot(jugador.x - zonaCentroX, jugador.y - zonaCentroY);
  if (dZona > zonaRadio) {
    jugador.vida -= 0.15;
    document.getElementById("zona-texto").style.display = "block";
  } else {
    document.getElementById("zona-texto").style.display = "none";
  }
}

// ============ COLISIONES BALAS ============
function verificarColisiones() {
  balas.forEach(bala => {
    if (!bala.viva) return;

    // Bala del jugador vs bots
    if (bala.dueno === "jugador") {
      bots.forEach(bot => {
        if (!bot.vivo) return;
        const d = Math.hypot(bala.x - bot.x - 10, bala.y - bot.y - 10);
        if (d < 18) {
          bot.recibirDano(bala.damage);
          bala.viva = false;
          if (!bot.vivo) {
            kills++;
            document.getElementById("kills-num").textContent = kills;
          }
        }
      });
    }

    // Bala de bot vs jugador
    if (bala.dueno !== "jugador" && jugador.vivo) {
      const d = Math.hypot(bala.x - jugador.x - 10, bala.y - jugador.y - 10);
      if (d < 18) {
        jugador.recibirDano(bala.damage);
        bala.viva = false;
      }
    }

    // Bala de bot vs otros bots
    if (bala.dueno !== "jugador") {
      bots.forEach(bot => {
        if (bot === bala.dueno || !bot.vivo) return;
        const d = Math.hypot(bala.x - bot.x - 10, bala.y - bot.y - 10);
        if (d < 18) {
          bot.recibirDano(bala.damage);
          bala.viva = false;
        }
      });
    }
  });
}

// ============ DIBUJAR MAPA ============
function dibujarMapa() {
  const startX = Math.max(0, Math.floor(camX / TILE));
  const startY = Math.max(0, Math.floor(camY / TILE));
  const endX = Math.min(MAPA_W / TILE, startX + Math.ceil(canvas.width / TILE) + 2);
  const endY = Math.min(MAPA_H / TILE, startY + Math.ceil(canvas.height / TILE) + 2);

  for (let y = startY; y < endY; y++) {
    for (let x = startX; x < endX; x++) {
      const sx = x * TILE - camX;
      const sy = y * TILE - camY;
      const tipo = mapa[y] ? mapa[y][x] : 1;

      switch(tipo) {
        case 1: ctx.fillStyle = "#2d5a1b"; break;
        case 2: ctx.fillStyle = "#1a3d0f"; break;
        case 3: ctx.fillStyle = "#666666"; break;
        case 4: ctx.fillStyle = "#1a4a7a"; break;
        default: ctx.fillStyle = "#2d5a1b";
      }
      ctx.fillRect(sx, sy, TILE, TILE);

      // Detalles
      if (tipo === 2) {
        ctx.fillStyle = "#0d2008";
        ctx.beginPath();
        ctx.arc(sx + TILE/2, sy + TILE/2, TILE/3, 0, Math.PI * 2);
        ctx.fill();
      } else if (tipo === 3) {
        ctx.fillStyle = "#888";
        ctx.beginPath();
        ctx.arc(sx + TILE/2, sy + TILE/2, TILE/3, 0, Math.PI * 2);
        ctx.fill();
      } else if (tipo === 4) {
        ctx.fillStyle = "#2266aa";
        ctx.fillRect(sx + 2, sy + 2, TILE - 4, TILE - 4);
      }

      // Grid sutil
      ctx.strokeStyle = "rgba(0,0,0,0.1)";
      ctx.lineWidth = 0.5;
      ctx.strokeRect(sx, sy, TILE, TILE);
    }
  }
}

// ============ DIBUJAR ZONA ============
function dibujarZona() {
  const sx = zonaCentroX - camX;
  const sy = zonaCentroY - camY;

  // Zona segura
  ctx.strokeStyle = "rgba(0,150,255,0.8)";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(sx, sy, zonaRadio, 0, Math.PI * 2);
  ctx.stroke();

  // Zona peligrosa
  ctx.fillStyle = "rgba(255,0,0,0.08)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.beginPath();
  ctx.arc(sx, sy, zonaRadio, 0, Math.PI * 2);
  ctx.clip();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.restore();
}

// ============ MINIMAPA ============
function dibujarMinimapa() {
  const escala = 100 / MAPA_W;
  minimapCtx.fillStyle = "#1a1a1a";
  minimapCtx.fillRect(0, 0, 100, 100);

  // Zona
  minimapCtx.strokeStyle = "rgba(0,150,255,0.8)";
  minimapCtx.lineWidth = 1;
  minimapCtx.beginPath();
  minimapCtx.arc(zonaCentroX * escala, zonaCentroY * escala, zonaRadio * escala, 0, Math.PI * 2);
  minimapCtx.stroke();

  // Bots
  bots.forEach(bot => {
    if (!bot.vivo) return;
    minimapCtx.fillStyle = "#ff4444";
    minimapCtx.fillRect(bot.x * escala - 1, bot.y * escala - 1, 3, 3);
  });

  // Jugador
  if (jugador.vivo) {
    minimapCtx.fillStyle = "#4488ff";
    minimapCtx.fillRect(jugador.x * escala - 2, jugador.y * escala - 2, 5, 5);
  }
}

// ============ ACTUALIZAR HUD ============
function actualizarHUD() {
  const vidaPct = jugador.vida / jugador.vidaMax;
  document.getElementById("vida-barra").style.width = (vidaPct * 100) + "%";
  document.getElementById("vida-num").textContent = Math.max(0, Math.floor(jugador.vida));
  const vivosCount = bots.filter(b => b.vivo).length + (jugador.vivo ? 1 : 0);
  document.getElementById("vivos-num").textContent = vivosCount;
}

// ============ VERIFICAR FIN ============
function verificarFin() {
  const botsVivos = bots.filter(b => b.vivo).length;

  if (!jugador.vivo) {
    mostrarResultado(false, botsVivos);
    return true;
  }
  if (botsVivos === 0) {
    mostrarResultado(true, 0);
    return true;
  }
  return false;
}

function mostrarResultado(gano, restantes) {
  cancelAnimationFrame(gameLoop);
  const pantalla = document.getElementById("pantalla-resultado");
  pantalla.style.display = "flex";
  document.getElementById("resultado-titulo").textContent = gano ? "🏆 ¡VICTORIA!" : "💀 ELIMINADO";
  document.getElementById("resultado-titulo").style.color = gano ? "#ffcc00" : "#ff4444";
  document.getElementById("resultado-stats").innerHTML = `
    💀 Kills: ${kills}<br>
    👥 Jugadores restantes: ${restantes}<br>
    🎯 Posición: #${gano ? 1 : 20 - kills}
  `;
}

function reiniciarJuego() {
  document.getElementById("pantalla-resultado").style.display = "none";
  iniciarJuego();
}

// ============ LOOP PRINCIPAL ============
function actualizar() {
  gameLoop = requestAnimationFrame(actualizar);

  // Zona
  zonaTimer++;
  if (zonaTimer > 300) {
    zonaRadio = Math.max(100, zonaRadio - 0.3);
  }

  actualizarJugador();
  bots.forEach(bot => actualizarBot(bot));
  balas.forEach(b => b.actualizar());
  balas = balas.filter(b => b.viva);
  verificarColisiones();

  // Cámara
  camX = Math.max(0, Math.min(MAPA_W - canvas.width, jugador.x - canvas.width / 2));
  camY = Math.max(0, Math.min(MAPA_H - canvas.height, jugador.y - canvas.height / 2));

  // Dibujar
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  dibujarMapa();
  dibujarZona();
  items.forEach(i => i.dibujar());
  bots.forEach(b => b.dibujar());
  if (jugador.vivo) jugador.dibujar();
  balas.forEach(b => b.dibujar());

  actualizarHUD();
  dibujarMinimapa();

  if (verificarFin()) return;
}
</script>
